version: "1"

session:
  save_root: recordings
  auto_record_duration: 30.0   # 30s of low-amplitude motion, then session exits

nodes:
  - type: AgentNode
    name: dummy_left
    agent_class: robots_realtime.agents.teleoperation.dummy_agent_from_current:DummyAgentFromCurrent
    agent_kwargs:
      state_key: state
      gripper_max_m: 0.1       # matches PiperRobot._gripper_hi default
      target_std: 0.02         # extra-conservative — first motion test on real hardware
      pose_interval: 2.0       # slower transitions between random targets
    loop_mode: fixed_rate
    poll_freq: 50.0            # rate-governor for fixed_rate; mirrors piper_holdpose.yaml
    state_topics:
      state: piper/joint_state

  - type: RobotNode
    name: piper
    cmd_topic: dummy_left/joint_pos
    robot_config: robot_configs/piper/single.yaml
    poll_freq: 200
    shutdown_joint_pos: null   # leave arm where session ended; don't park to zero
