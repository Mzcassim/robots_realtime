version: "1"

session:
  save_root: recordings
  auto_record_duration: 10.0

nodes:
  - type: AgentNode
    name: gello_left
    agent_class: robots_realtime.agents.teleoperation.dummy_agent:DummyAgent
    agent_kwargs:
      arm: left
      target_std: 0.05      # small motion amplitude — runs on real hardware
      pose_interval: 1.0
    loop_mode: flat_out
    publish_freq: 200.0

  - type: RobotNode
    name: piper
    cmd_topic: gello_left/joint_pos
    robot_config: robot_configs/piper/single.yaml
    poll_freq: 200
