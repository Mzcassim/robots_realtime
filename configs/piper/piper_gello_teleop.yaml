version: "1"

session:
  save_root: recordings
  record_topic: gello_left/record

nodes:
  - type: AgentNode
    name: gello_left
    agent_class: robots_realtime.agents.teleoperation.gello_leader_agent:GelloLeaderAgent
    agent_kwargs:
      port: /dev/ttyACM0
      robot_name: left
      include_gripper: true
      joint_signs: [-1, -1, -1, -1, -1, -1]
    arm_key: left
    loop_mode: flat_out

  - type: RobotNode
    name: piper
    cmd_topic: gello_left/joint_pos
    robot_config: robot_configs/piper/single.yaml
    poll_freq: 200
